aid: groover
name: Groover
description: 'Groover is a music promotion platform that connects independent artists
  and their representatives with a network of more than 3,000 vetted music-industry
  professionals — playlist curators, bloggers, journalists, radio stations, record
  labels, and managers. Artists submit a track and spend credits ("Grooviz", roughly
  €2 each) to reach individual curators, and Groover guarantees personalized feedback
  within seven days or refunds the credit. Founded in Paris in 2018, the company also
  operates Temple by Groover, a fanbase-growth toolset. Groover runs a consumer web
  application on a credit-based, pay-per-submission model and publishes no public
  developer API.'
